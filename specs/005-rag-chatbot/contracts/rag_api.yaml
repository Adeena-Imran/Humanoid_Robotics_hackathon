openapi: 3.0.0
info:
  title: RAG Chatbot API
  version: 1.0.0
  description: API for the Retrieval-Augmented Generation (RAG) Chatbot service.
servers:
  - url: http://localhost:8000
    description: Local development server
paths:
  /chat:
    post:
      summary: Process a user chat query
      operationId: processChatQuery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RagChatRequest'
      responses:
        '200':
          description: Successful response with generated answer or summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RagChatResponse'
        '400':
          description: Invalid request payload.
        '500':
          description: Internal server error.
components:
  schemas:
    RagChatRequest:
      type: object
      required:
        - query_type
      properties:
        query_type:
          type: string
          enum:
            - explanation
            - chapter_summary
            - book_summary
          description: The type of query being made.
        text:
          type: string
          nullable: true
          description: The user's natural language question or topic for explanation. Required for 'explanation' query_type if 'selected_text' is not provided.
        selected_text:
          type: string
          nullable: true
          description: An optional text snippet highlighted by the user for context-specific explanations. Used with 'explanation' query_type.
        chapter_id:
          type: string
          nullable: true
          description: The identifier for a specific chapter if a chapter summary is requested. Required for 'chapter_summary' query_type.
      examples:
        - query_type: explanation
          text: What is a PID controller?
        - query_type: explanation
          selected_text: "A PID controller constantly calculates an error value..."
          text: Explain this text.
        - query_type: chapter_summary
          chapter_id: intro-humanoid-robotics
        - query_type: book_summary
    RagChatResponse:
      type: object
      required:
        - response
        - sources
      properties:
        response:
          type: string
          description: The generated answer or summary text.
        sources:
          type: array
          description: References to the content chunks or chapter summaries used to generate the response.
          items:
            $ref: '#/components/schemas/SourceReference'
    SourceReference:
      type: object
      required:
        - source_file
        - chapter_title
      properties:
        source_file:
          type: string
          description: The original filename of the source document.
        chapter_title:
          type: string
          description: The title of the chapter the source belongs to.
        section_title:
          type: string
          nullable: true
          description: The title of the section the source belongs to.
      examples:
        - source_file: intro-humanoid-robotics.mdx
          chapter_title: Introduction to Humanoid Robotics
          section_title: Actuators
